name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python3 -m unittest -v

      - name: Validate catalog schema
        run: python3 catalog_engine.py --tool validate

      - name: Run engine self-test
        run: python3 catalog_engine.py --tool selftest --database :memory:

      - name: Compile check
        run: python3 -m py_compile catalog_engine.py test_catalog_engine.py